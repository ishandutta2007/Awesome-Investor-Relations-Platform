<svg width="1200" height="240" viewBox="0 0 1200 240" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="line-grad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.2"/>
    </linearGradient>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 38px; fill: url(#text-grad); }
      .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 17px; fill: #94a3b8; }
      .tag-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 12px; fill: #38bdf8; letter-spacing: 1px; }

      @keyframes floatParticle {
        0%, 100% { transform: translateY(0px); opacity: 0.3; }
        50% { transform: translateY(-10px); opacity: 0.8; }
      }
      @keyframes pulsePath {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.7; }
      }
      .particle { animation: floatParticle 4s ease-in-out infinite; }
      .p2 { animation-delay: 1.5s; }
      .p3 { animation-delay: 3s; }
      .bg-path { animation: pulsePath 6s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="1200" height="240" rx="16" fill="url(#bg-grad)"/>

  <!-- Background Decorative Chart Lines (Strictly behind text) -->
  <g class="bg-path">
    <path d="M 40 190 Q 250 130 500 160 T 950 90 T 1160 50" fill="none" stroke="url(#line-grad1)" stroke-width="3"/>
    <path d="M 40 205 Q 350 170 650 120 T 1000 140 T 1160 80" fill="none" stroke="#6366f1" stroke-opacity="0.2" stroke-width="2"/>
  </g>

  <!-- Dynamic Animated Glow Particles -->
  <circle class="particle" cx="150" cy="50" r="4" fill="#38bdf8"/>
  <circle class="particle p2" cx="1050" cy="180" r="5" fill="#c084fc"/>
  <circle class="particle p3" cx="920" cy="45" r="4" fill="#818cf8"/>
  <circle class="particle p2" cx="280" cy="195" r="3" fill="#38bdf8"/>

  <!-- Foreground Text Content -->
  <g transform="translate(60, 0)">
    <!-- Category Badge -->
    <rect x="0" y="40" width="230" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="115" y="58" text-anchor="middle" class="tag-text">INVESTOR RELATIONS TECH</text>

    <!-- Main Title -->
    <text x="0" y="115" class="title">Awesome Investor Relations Platform &#128640;</text>

    <!-- Subtitle -->
    <text x="0" y="158" class="subtitle">Curated Investor CRM, LP Portals, Cap Table Management &amp; Portfolio Intelligence Software</text>
  </g>
</svg>
